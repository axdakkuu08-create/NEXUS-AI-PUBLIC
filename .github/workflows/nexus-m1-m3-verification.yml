name: NEXUS-AI M1-M3 verification

on:
  workflow_dispatch:
  push:
    branches: [ci/verify-m1-m3]

permissions:
  contents: read

concurrency:
  group: nexus-m1-m3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare frontend source
        run: |
          if [ ! -f frontend/nexus-m1-review/package.json ]; then
            if [ -f NEXUS-AI-frontend-M1.zip ]; then
              mkdir -p frontend/nexus-m1-review
              unzip -q NEXUS-AI-frontend-M1.zip -d frontend/nexus-m1-review
            else
              echo "::error::Frontend source is missing. Upload NEXUS-AI-frontend-M1.zip to the repository root on branch ci/verify-m1-m3."
              exit 1
            fi
          fi
          test -f frontend/nexus-m1-review/package.json || {
            echo "::error::The ZIP did not contain package.json at its root."
            exit 1
          }
      - name: Fix navigation and dashboard prerender issues
        working-directory: frontend/nexus-m1-review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          edits = {
              "src/app/(app)/layout.tsx": [
                  (r'const active\s*=\s*item\.href === "/"\s*\?\s*pathname === "/" \|\| pathname === "/home"\s*:\s*pathname\.startsWith\(item\.href\);',
                   'const active = pathname.startsWith(item.href);'),
                  (r'href=\{item\.href === "/" \? "/home" : item\.href\}', 'href={item.href}'),
              ],
              "src/components/layout/MobileNavigation.tsx": [
                  (r'const active\s*=\s*item\.href === "/"\s*\?\s*pathname === "/" \|\| pathname === ""\s*:\s*pathname\.startsWith\(item\.href\);',
                   'const active = pathname.startsWith(item.href);'),
              ],
              "src/app/(app)/dashboard/page.tsx": [
                  (r'(?m)^import \{ formatRelativeTime \} from "@/lib/utils";
                   'import { formatRelativeTime } from "@/lib/utils";\nimport { connection } from "next/server";'),
                  (r'export default function DashboardPage\(\) \{',
                   'export default async function DashboardPage() {\n  await connection();'),
              ],
          }

          for filename, replacements in edits.items():
              path = Path(filename)
              source = path.read_text()
              for pattern, value in replacements:
                  source, count = re.subn(pattern, value, source, count=1)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one matching navigation expression in {filename}; found {count}.")
              path.write_text(source)
              print(f"Patched {filename}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm source and prepare lockfile
        working-directory: frontend/nexus-m1-review
        run: |
          test -f package.json || { echo '::error::package.json is missing from the extracted source.'; exit 1; }
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
          fi
          test -f package-lock.json || { echo '::error::Could not generate package-lock.json from package.json.'; exit 1; }
      - name: Install locked dependencies from official npm registry
        working-directory: frontend/nexus-m1-review
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: ESLint
        working-directory: frontend/nexus-m1-review
        run: npm run lint
      - name: TypeScript
        working-directory: frontend/nexus-m1-review
        run: npx tsc --noEmit
      - name: Next.js production build
        working-directory: frontend/nexus-m1-review
        run: npm run build
      - name: Start production server
        working-directory: frontend/nexus-m1-review
        run: |
          (npm run start -- --hostname 127.0.0.1 > /tmp/nexus-next.log 2>&1 & echo $! > /tmp/nexus-next.pid)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexus-next.log
          exit 1
      - name: Verify all application routes
        working-directory: frontend/nexus-m1-review
        run: |
          set -e
          for route in /home /dashboard /chat /projects /tasks /agents /workflows /tools /activity /settings; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            case "$code" in
              200|307|308) echo "$route -> $code" ;;
              *) echo "::error::$route returned $code"; exit 1 ;;
            esac
          done
          root_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          test "$root_code" = "200" -o "$root_code" = "307" -o "$root_code" = "308"
      - name: Install Playwright for viewport checks
        working-directory: frontend/nexus-m1-review
        run: |
          npm install --no-save --package-lock=false playwright --registry=https://registry.npmjs.org --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile viewport smoke tests
        working-directory: frontend/nexus-m1-review
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const viewport of [{ width: 390, height: 844 }, { width: 360, height: 800 }, { width: 768, height: 1024 }]) {
              const page = await browser.newPage({ viewport });
              for (const route of ['/home', '/chat', '/workflows']) {
                const response = await page.goto('http://127.0.0.1:3000' + route, { waitUntil: 'networkidle' });
                if (!response || response.status() >= 400) throw new Error(route + ' failed at ' + viewport.width);
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
                if (overflow) throw new Error('Horizontal overflow on ' + route + ' at ' + viewport.width);
              }
              await page.close();
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android wrapper exists
        id: wrapper
        run: |
          if [ -f frontend/nexus-m1-review/capacitor.config.ts ] || [ -f frontend/nexus-m1-review/capacitor.config.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android APK job is waiting for a Capacitor Android wrapper. The current candidate ZIP contains no Capacitor config or android/ project."
          fi
      - uses: actions/setup-java@v4
        if: steps.wrapper.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        if: steps.wrapper.outputs.present == 'true'
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        if: steps.wrapper.outputs.present == 'true'
      - name: Install dependencies and build APK
        if: steps.wrapper.outputs.present == 'true'
        working-directory: frontend/nexus-m1-review
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-debug-apk
          path: frontend/nexus-m1-review/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
,
                   'import { formatRelativeTime } from "@/lib/utils";\nimport { connection } from "next/server";'),
                  (r'export default function DashboardPage\(\) \{',
