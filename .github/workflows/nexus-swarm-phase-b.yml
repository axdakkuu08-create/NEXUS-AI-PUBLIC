name: NEXUS Swarm Phase B verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/nexus-swarm-visualization
  pull_request:
    branches:
      - main
      - chore/m1-m3-verification-assets
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: nexus-swarm-phase-b-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verification:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/nexus-swarm-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert ZIP-free application source layout
        run: |
          set -euo pipefail
          test -f package.json
          test -f next.config.ts
          test -f tsconfig.json
          test -f "src/app/(app)/swarm/page.tsx"
          test -f src/lib/swarm/engine.ts
          test -f src/components/swarm/SwarmMonitor.tsx
          test ! -d phase-b-swarm
          test ! -f scripts/prepare-vercel-preview.sh
          echo "Swarm and NEXUS frontend are ordinary checked-in application source."
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Deterministic Swarm engine tests
        run: npm run test:swarm
      - name: Next.js production build
        run: npm run build
      - name: Start production server
        run: |
          (npm run start -- --hostname 127.0.0.1 > /tmp/nexus-swarm-next.log 2>&1 & echo $! > /tmp/nexus-swarm-next.pid)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/swarm >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexus-swarm-next.log
          exit 1
      - name: Verify application routes
        run: |
          set -e
          for route in / /home /dashboard /chat /projects /tasks /agents /workflows /tools /activity /settings /swarm; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            case "$code" in 200|307|308) echo "$route -> $code" ;; *) echo "::error::$route returned $code"; exit 1 ;; esac
          done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright --registry=https://registry.npmjs.org --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile Swarm and navigation checks
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of [{ width: 390, height: 844 }, { width: 360, height: 800 }, { width: 768, height: 1024 }]) {
                const page = await browser.newPage({ viewport });
                const response = await page.goto('http://127.0.0.1:3000/swarm', { waitUntil: 'networkidle' });
                if (!response || response.status() >= 400) throw new Error('Swarm route failed at ' + viewport.width);
                if (!(await page.getByText('Demo simulation — not live agent activity').count())) throw new Error('Demo-only disclosure is missing');
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
                if (overflow) throw new Error('Horizontal overflow at ' + viewport.width);
                const pauseControl = page.locator('button[aria-pressed]');
                await pauseControl.click();
                if (await pauseControl.getAttribute('aria-pressed') !== 'true') throw new Error('Pause control did not enter the paused state');
                await page.getByRole('button', { name: 'Resume' }).click();
                if (await pauseControl.getAttribute('aria-pressed') !== 'false') throw new Error('Resume control did not clear the paused state');

                if (viewport.width < 768) {
                  const link = page.locator('nav[aria-label="Primary mobile navigation"] a[href="/swarm"]');
                  if (!(await link.isVisible())) throw new Error('Swarm mobile navigation link is missing');
                  await page.goto('http://127.0.0.1:3000/home', { waitUntil: 'networkidle' });
                  const trigger = page.locator('button[aria-label="Open menu"]');
                  await trigger.click();
                  const dialog = page.getByRole('dialog', { name: 'NEXUS-AI navigation' });
                  if (!(await dialog.isVisible())) throw new Error('Mobile drawer did not open');
                  if (await trigger.getAttribute('aria-expanded') !== 'true') throw new Error('Menu trigger did not announce expanded state');
                  if (await trigger.getAttribute('aria-controls') !== 'mobile-navigation-drawer') throw new Error('Menu trigger is not associated with the drawer');
                  const close = page.getByRole('button', { name: 'Close menu' });
                  if (!(await close.evaluate(el => el === document.activeElement))) throw new Error('Initial focus was not moved into the drawer');

                  const last = dialog.locator('a[href="/settings"]');
                  await page.keyboard.press('Shift+Tab');
                  if (!(await last.evaluate(el => el === document.activeElement))) throw new Error('Shift+Tab did not wrap from first to last control');
                  await page.keyboard.press('Tab');
                  if (!(await close.evaluate(el => el === document.activeElement))) throw new Error('Tab did not wrap from last to first control');

                  await last.focus();
                  await page.keyboard.press('Tab');
                  if (!(await close.evaluate(el => el === document.activeElement))) throw new Error('Forward Tab did not wrap from last to first control');
                  await close.focus();
                  await page.keyboard.press('Shift+Tab');
                  if (!(await last.evaluate(el => el === document.activeElement))) throw new Error('Reverse Tab did not wrap from first to last control');

                  await page.evaluate(() => {
                    document.body.tabIndex = -1;
                    document.body.focus();
                  });
                  await page.keyboard.press('Tab');
                  if (!(await close.evaluate(el => el === document.activeElement))) throw new Error('Focus outside the drawer was not redirected inside');

                  await page.keyboard.press('Escape');
                  if (await dialog.count()) throw new Error('Escape did not close the mobile drawer');
                  if (await trigger.getAttribute('aria-expanded') !== 'false') throw new Error('Menu trigger did not announce collapsed state');
                  if (!(await trigger.evaluate(el => el === document.activeElement))) throw new Error('Focus was not restored to the menu trigger');
                }
                await page.close();

                if (viewport.width === 390) {
                  const reducedPage = await browser.newPage({ viewport, reducedMotion: 'reduce' });
                  await reducedPage.goto('http://127.0.0.1:3000/swarm', { waitUntil: 'networkidle' });
                  if (!(await reducedPage.getByText('Reduced motion').isVisible())) throw new Error('Reduced-motion preference was not surfaced in the UI');
                  await reducedPage.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
