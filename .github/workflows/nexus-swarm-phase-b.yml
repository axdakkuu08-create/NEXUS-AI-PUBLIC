name: NEXUS Swarm one-time source migration

on:
  push:
    branches:
      - feat/nexus-swarm-visualization

permissions:
  contents: write

concurrency:
  group: nexus-swarm-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.head_commit.message == 'Prepare one-time ZIP-free Swarm source migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize ordinary application source
        run: |
          set -euo pipefail
          test ! -d src/app
          mkdir -p /tmp/nexus-m1-source
          unzip -q NEXUS-AI-M1-source-for-verification.zip -d /tmp/nexus-m1-source
          test -f /tmp/nexus-m1-source/package.json
          test -f /tmp/nexus-m1-source/src/app/layout.tsx
          cp -R /tmp/nexus-m1-source/. .
      - name: Apply deterministic relative-time rendering fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path("src")
          dashboard = root / "app/(app)/dashboard/page.tsx"
          text = dashboard.read_text()
          text = text.replace('import { formatRelativeTime } from "@/lib/utils";' + chr(10), "")
          text = text.replace('import Link from "next/link";', 'import Link from "next/link";' + chr(10) + 'import { RelativeTime } from "@/components/ui/RelativeTime";')
          text = text.replace('{formatRelativeTime(item.timestamp)}', '<RelativeTime timestamp={item.timestamp} />')
          dashboard.write_text(text)
          workflows = root / "app/(app)/workflows/page.tsx"
          text = workflows.read_text()
          text = text.replace('import { formatRelativeTime } from "@/lib/utils";' + chr(10), "")
          text = text.replace('import { mockWorkflows } from "@/data/mock";', 'import { mockWorkflows } from "@/data/mock";' + chr(10) + 'import { RelativeTime } from "@/components/ui/RelativeTime";')
          text = text.replace('{formatRelativeTime(w.lastRun)}', '<RelativeTime timestamp={w.lastRun} />')
          workflows.write_text(text)
          relative = root / "components/ui/RelativeTime.tsx"
          relative.write_text('''"use client";

          import { useSyncExternalStore } from "react";

          function subscribe() {
            return () => {};
          }

          function getRelativeTime(timestamp: string): string {
            const date = new Date(timestamp);
            const minutes = Math.floor((Date.now() - date.getTime()) / 60000);
            if (minutes < 1) return "just now";
            if (minutes < 60) return `${minutes}m ago`;
            if (minutes < 1440) return `${Math.floor(minutes / 60)}h ago`;
            if (minutes < 10080) return `${Math.floor(minutes / 1440)}d ago`;
            return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
          }

          export function RelativeTime({ timestamp }: { timestamp: string }) {
            const value = useSyncExternalStore(subscribe, () => getRelativeTime(timestamp), () => "—");
            return <>{value}</>;
          }
          ''')
          PY
      - name: Integrate Swarm and remove the overlay pipeline
        run: |
          set -euo pipefail
          cp -R phase-b-swarm/src/. src/
          test -f "src/app/(app)/swarm/page.tsx"
          test -f src/lib/swarm/engine.ts
          test -f src/components/swarm/SwarmMonitor.tsx
          rm -rf phase-b-swarm
          rm -f scripts/prepare-vercel-preview.sh
          rmdir scripts 2>/dev/null || true
          rm -rf /tmp/nexus-m1-source
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify production routes
        run: |
          (npm run start -- --hostname 127.0.0.1 > /tmp/nexus-swarm-next.log 2>&1 & echo $! > /tmp/nexus-swarm-next.pid)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/swarm >/dev/null; then break; fi
            sleep 2
          done
          for route in / /home /dashboard /chat /projects /tasks /agents /workflows /tools /activity /settings /swarm; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            case "$code" in 200|307|308) echo "$route -> $code" ;; *) cat /tmp/nexus-swarm-next.log; exit 1 ;; esac
          done
      - name: Commit migrated source to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate NEXUS Swarm to checked-in application source"
          git push origin HEAD:feat/nexus-swarm-visualization
