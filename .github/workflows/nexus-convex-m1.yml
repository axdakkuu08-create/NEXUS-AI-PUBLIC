name: NEXUS Convex M1 backend verification

on:
  push:
    branches:
      - feat/nexus-backend-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-convex-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Convex types and validate backend on an isolated anonymous deployment
        env:
          CONVEX_AGENT_MODE: anonymous
        run: npx convex dev --once --typecheck enable
      - name: Run M1 runtime security tests
        run: npm run test:backend
      - name: Strict backend TypeScript check
        run: npx tsc --noEmit -p convex/tsconfig.json
      - name: Preserve generated Convex types for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-convex-generated-types
          path: convex/_generated/
          if-no-files-found: warn
          retention-days: 7
