name: NEXUS Convex development deployment

on:
  push:
    branches:
      - feat/nexus-backend-foundation
  workflow_dispatch:
    inputs:
      target_deployment:
        description: "Must exactly match the approved Development deployment"
        required: true
        type: choice
        options:
          - shocking-salamander-814
      authorize_development_deploy:
        description: "Explicitly authorize syncing backend code to this Development deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-convex-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety-check:
    name: Validate development-only deployment guardrails
    if: github.ref == 'refs/heads/feat/nexus-backend-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify branch, target configuration, and Clerk issuer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/nexus-backend-foundation"
          test -f convex/auth.config.ts
          grep -Fq 'domain: "https://charmed-goshawk-6691.clerk.accounts.dev"' convex/auth.config.ts
          grep -Fq 'applicationID: "convex"' convex/auth.config.ts
          node -e "const p=require('./package.json'); if (!p.dependencies?.convex || p.dependencies.convex !== '1.48.0') process.exit(1);"
          echo "Guardrails passed. This job does not contact or deploy to Convex."

  deploy-development:
    name: Deploy only to NEXUS-AI Development
    needs: safety-check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/nexus-backend-foundation' &&
      inputs.authorize_development_deploy == true &&
      inputs.target_deployment == 'shocking-salamander-814'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nexus-development
    permissions:
      contents: read
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require a committed lockfile before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s package-lock.json ]]; then
            echo "::error::A committed package-lock.json is required. Refusing a non-reproducible deployment."
            exit 1
          fi
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail closed unless the credential is scoped to the approved development deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CONVEX_DEPLOY_KEY:-}" ]]; then
            echo "::error::CONVEX_DEV_DEPLOY_KEY is not configured."
            exit 1
          fi
          case "$CONVEX_DEPLOY_KEY" in
            dev:shocking-salamander-814\|*) ;;
            *)
              echo "::error::Credential is not scoped to dev:shocking-salamander-814. Refusing deployment."
              exit 1
              ;;
          esac
      - name: Sync Convex backend to the scoped Development deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
        run: npx convex dev --once --typecheck enable
