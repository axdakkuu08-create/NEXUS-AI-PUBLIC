name: Temporary npm lockfile generation

on:
  push:
    branches:
      - feat/nexus-swarm-visualization
    paths:
      - .github/workflows/temporary-npm-lockfile.yml

permissions:
  contents: read

concurrency:
  group: temporary-npm-lockfile-{github.ref}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/feat/nexus-swarm-visualization' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the authorized feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/nexus-swarm-visualization
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Validate lockfile with npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Commit lockfile and remove this temporary workflow
        env:
          TARGET_BRANCH: feat/nexus-swarm-visualization
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion < 2 || !p.packages || !p.packages['']) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/temporary-npm-lockfile.yml
          git commit -m "chore: add reproducible npm lockfile"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
