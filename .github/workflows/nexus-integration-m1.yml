name: NEXUS integration M1 gate

on:
  push:
    branches:
      - integration/frontend-backend-reconciliation
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/nexus-integration-m1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-integration-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install and create reproducible lockfile
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile to integration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/frontend-backend-reconciliation'
        run: |
          if [ -f package-lock.json ]; then
            git add package-lock.json
            if ! git diff --cached --quiet -- package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "build: add reproducible integration lockfile"
              git push
            fi
          fi
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Convex types
        env:
          CONVEX_AGENT_MODE: anonymous
        run: npx convex dev --once --typecheck enable
      - name: Backend ownership and persistence tests
        run: npm run test:backend
      - name: Frontend lint and typecheck
        run: npm run lint && npm run typecheck
      - name: Swarm regression tests
        run: npm run test:swarm
      - name: Next.js production build
        run: npm run build
