name: NEXUS Emerald workspace verification

on:
  push:
    branches:
      - feat/nexus-emerald-workspace-ui-main
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: nexus-emerald-ui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Swarm regression tests
        run: npm run test:swarm
      - name: Next.js production build
        run: npm run build
      - name: Start production server
        run: |
          (npm run start -- --hostname 127.0.0.1 > /tmp/nexus-emerald-next.log 2>&1 & echo $! > /tmp/nexus-emerald-next.pid)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/home >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nexus-emerald-next.log
          exit 1
      - name: Verify application routes
        run: |
          set -euo pipefail
          for route in / /home /dashboard /chat /projects /tasks /agents /workflows /tools /activity /settings /swarm; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$route")
            case "$code" in 200|307|308) echo "$route -> $code" ;; *) echo "::error::$route returned $code"; exit 1 ;; esac
          done
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile workspace and navigation checks
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of [{ width: 390, height: 844 }, { width: 360, height: 800 }, { width: 768, height: 1024 }]) {
                const page = await browser.newPage({ viewport });
                const response = await page.goto('http://127.0.0.1:3000/home', { waitUntil: 'networkidle' });
                if (!response || response.status() >= 400) throw new Error('Home route failed at ' + viewport.width);
                if (!(await page.getByText('One workspace.').isVisible())) throw new Error('Workspace hero is missing');
                if (!(await page.getByText('Workspace overview').isVisible())) throw new Error('Workspace overview is missing');
                if (!(await page.getByText('Live metrics unavailable').isVisible())) throw new Error('Unavailable live metrics are not disclosed');
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
                if (overflow) throw new Error('Horizontal overflow at ' + viewport.width);
                if (viewport.width < 768) {
                  const trigger = page.locator('button[aria-label="Open menu"]');
                  await trigger.click();
                  const dialog = page.getByRole('dialog', { name: 'NEXUS-AI navigation' });
                  if (!(await dialog.isVisible())) throw new Error('Mobile drawer did not open');
                  await page.keyboard.press('Escape');
                  if (await dialog.count()) throw new Error('Escape did not close mobile navigation');
                  if (!(await trigger.evaluate(el => el === document.activeElement))) throw new Error('Focus was not restored after closing navigation');
                }
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
