name: Generate and verify NEXUS npm lockfile

on:
  push:
    branches:
      - feat/nexus-backend-foundation
    paths:
      - .github/workflows/nexus-generate-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/feat/nexus-backend-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate lockfile from the committed manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3
      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (l.lockfileVersion !== 3 || l.packages?.['']?.name !== p.name || JSON.stringify(l.packages[''].dependencies) !== JSON.stringify(p.dependencies) || JSON.stringify(l.packages[''].devDependencies) !== JSON.stringify(p.devDependencies)) process.exit(1)"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the committed manifest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:feat/nexus-backend-foundation
