<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070D" />
    <meta name="robots" content="noindex,nofollow" />
    <title>NEXUS-AI · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #05070D; color: #F0F6FF; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #29384F; border-radius: 24px; background: #0B101A; text-align: center; }
      .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 20px; border: 1px solid #00D9FF; border-radius: 20px; color: #65E8FF; font-size: 30px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { color: #A6B6CC; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 999px; background: #00D9FF; color: #05070D; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">N</div>
      <h1>You're offline</h1>
      <p>NEXUS can show this generic offline information page. Previously visited workspace pages, account data, conversations, and private route responses are not available offline.</p>
      <p>Reconnect to authenticate and continue using your workspace.</p>
      <a href="/">Try NEXUS again</a>
    </main>
  </body>
</html>
